# Pages CMS settings: what students see when they edit the site at https://app.pagescms.org
# Docs: https://pagescms.org/docs/configuration/
#
# Each entry below matches a file in website-code/content/. If you add a new field to
# website-code/build.py, add it here too, then run: python3 website-code/tools/check_editor_config.py
# This file must stay at the top of the repository: Pages CMS only looks for it there.

media:
- name: photos
  label: Photos
  input: website-code/content/photos
  output: /photos
  categories:
  - image
  rename: safe
- name: files
  label: Audio, video and PDFs
  input: website-code/content/files
  output: /files
  categories:
  - audio
  - video
  - document
  rename: safe
components:
  photo:
    type: object
    label: Photo
    fields:
    - name: image
      label: Photo
      type: image
      options:
        media: photos
    - name: caption
      label: Caption
      type: string
      description: Who is in the photo? Names help visitors and future students.
  heading_section:
    type: object
    label: Heading
    fields:
    - name: text
      label: Heading
      type: string
  text_section:
    type: object
    label: Text
    fields:
    - name: body
      label: Text
      type: rich-text
      options:
        format: html
        media: false
  photo_section:
    type: object
    label: Photo
    fields:
    - name: image
      label: Photo
      type: image
      options:
        media: photos
    - name: caption
      label: Caption
      type: string
      description: Who is in the photo? Names help visitors and future students.
    - name: link
      label: Link (optional)
      type: string
      description: Leave empty to open the photo larger when clicked. A page on this site, like cake-bake.html, or a full
        web address starting with https://
  gallery_section:
    type: object
    label: Photo gallery
    fields:
    - name: photos
      label: Photos
      component: photo
      list:
        collapsible:
          collapsed: true
          summary: '{caption}'
  button_section:
    type: object
    label: Button
    fields:
    - name: label
      label: Button text
      type: string
    - name: link
      label: Link
      type: string
      description: A page on this site, like cake-bake.html, or a full web address starting with https://
  embed_section:
    type: object
    label: YouTube or SoundCloud
    fields:
    - name: url
      label: Link
      type: string
      description: Paste the YouTube or SoundCloud address.
  audio_section:
    type: object
    label: Audio player
    fields:
    - name: file
      label: Audio file (MP3)
      type: file
      options:
        media: files
    - name: title
      label: Title
      type: string
    - name: subtitle
      label: Subtitle (optional)
      type: string
  video_section:
    type: object
    label: Video file
    fields:
    - name: file
      label: Video file (MP4)
      type: file
      options:
        media: files
    - name: poster
      label: Still photo shown before it plays (optional)
      type: image
      options:
        media: photos
  contact_form_section:
    type: object
    label: Contact form
    fields:
    - name: note
      label: Note
      type: string
      description: This section shows the contact form. Nothing to fill in.
      readonly: true
  bibliography_section:
    type: object
    label: Bibliography
    fields:
    - name: items
      label: Sources
      type: string
      list: true
  column_content:
    type: block
    label: Column content
    list: true
    blockKey: type
    blocks:
    - name: heading
      label: Heading
      component: heading_section
    - name: text
      label: Text
      component: text_section
    - name: photo
      label: Photo
      component: photo_section
    - name: gallery
      label: Photo gallery
      component: gallery_section
    - name: button
      label: Button
      component: button_section
    - name: embed
      label: YouTube or SoundCloud
      component: embed_section
    - name: audio
      label: Audio player
      component: audio_section
    - name: video
      label: Video file
      component: video_section
    - name: contact_form
      label: Contact form
      component: contact_form_section
    - name: bibliography
      label: Bibliography
      component: bibliography_section
  columns_section:
    type: object
    label: Side-by-side columns
    fields:
    - name: columns
      label: Columns
      type: object
      description: Each column holds its own sections. On phones the columns stack.
      fields:
      - name: blocks
        label: Column content
        component: column_content
      list:
        collapsible:
          collapsed: true
          summary: Column {index}
  page_sections:
    type: block
    label: Page sections
    list: true
    blockKey: type
    blocks:
    - name: heading
      label: Heading
      component: heading_section
    - name: text
      label: Text
      component: text_section
    - name: photo
      label: Photo
      component: photo_section
    - name: gallery
      label: Photo gallery
      component: gallery_section
    - name: button
      label: Button
      component: button_section
    - name: embed
      label: YouTube or SoundCloud
      component: embed_section
    - name: audio
      label: Audio player
      component: audio_section
    - name: video
      label: Video file
      component: video_section
    - name: contact_form
      label: Contact form
      component: contact_form_section
    - name: bibliography
      label: Bibliography
      component: bibliography_section
    - name: columns
      label: Side-by-side columns
      component: columns_section
