- name: site
  label: Site settings and menu
  type: file
  path: website-code/content/site.json
  format: json
  operations:
    delete: false
  fields:
  - name: site_url
    label: Website address
    type: string
    description: The address the site will have, like https://www.sootsblues.org/ (used for sharing links).
  - name: email
    label: Email address
    type: string
  - name: social
    label: Social media
    type: object
    fields:
    - name: name
      label: Name
      type: string
      description: Instagram, Facebook or YouTube get their own icons.
    - name: url
      label: Link
      type: string
    - name: handle
      label: Handle
      type: string
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
  - name: menu
    label: Menu
    type: object
    description: The menu at the top of every page.
    fields:
    - name: label
      label: Menu item
      type: string
    - name: link
      label: Link
      type: string
      description: A page on this site, like cake-bake.html, or a full web address starting with https://
    - name: feature_image
      label: Photo in the dropdown
      type: image
      options:
        media: photos
    - name: items
      label: Dropdown links
      type: object
      fields:
      - name: label
        label: Text
        type: string
      - name: link
        label: Link
        type: string
        description: A page on this site, like cake-bake.html, or a full web address starting with https://
      - name: indent
        label: Indented (a sub-page of the link above)
        type: boolean
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
  - name: donate_button
    label: Donate button
    type: object
    fields:
    - name: label
      label: Button text
      type: string
    - name: link
      label: Link
      type: string
      description: A page on this site, like cake-bake.html, or a full web address starting with https://
  - name: sections
    label: Page groups
    type: object
    description: Pages in the same group get “In this section” links and Previous/Next buttons.
    fields:
    - name: name
      label: Group name
      type: string
    - name: pages
      label: Pages
      type: string
      description: Like cake-bake.html, in order.
      list: true
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
  - name: footer
    label: Footer
    type: object
    fields:
    - name: about
      label: About text
      type: text
    - name: copyright
      label: Copyright line
      type: string
    - name: tagline
      label: Tagline
      type: string
  - name: logo
    label: Logo
    type: image
    description: The round SOOTS badge. Used for the logo, the footer and the browser tab icon.
    options:
      media: photos
  - name: share_image
    label: Sharing photo
    type: image
    description: Shown when the site is shared on social media.
    options:
      media: photos
  - name: default_description
    label: Default search description
    type: text
settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: Create {path} (by {userName} via Pages CMS)
      update: Update {path} (by {userName} via Pages CMS)
      delete: Delete {path} (by {userName} via Pages CMS)
      rename: Rename {oldPath} to {newPath} (by {userName} via Pages CMS)
