- name: pages
  label: Pages
  type: collection
  path: website-code/content/pages
  format: json
  subfolders: false
  exclude:
  - 2026.json
  - archive.json
  - contact-us.json
  - donations.json
  - episode-3-fountain.json
  - events.json
  - folk-projects.json
  - in-the-field.json
  - local-support.json
  - prarthana.json
  - social.json
  - soil-to-soul-series.json
  operations:
    rename: false
    delete: false
  filename:
    template: '{primary}.json'
    field: create
  view:
    primary: title
    fields:
    - title
    sort:
    - title
  fields:
  - name: title
    label: Page title
    type: string
    description: The big heading at the top of the page.
    required: true
  - name: description
    label: Search description
    type: text
    description: One or two sentences that Google and social media show for this page.
  - name: kicker
    label: Small label above the title
    type: string
    description: Optional. Leave empty to show the menu section, like “Events”.
  - name: subtitle
    label: Line under the title
    type: string
    description: Optional.
  - name: menu_section
    label: Menu section
    type: string
    description: 'Only for pages that are not in the menu: the top menu item this page belongs under, for example In the Field.'
  - name: banner_image
    label: Banner photo
    type: image
    description: The wide photo behind the title.
    options:
      media: photos
  - name: banner_video
    label: Banner video
    type: file
    description: Optional. A short silent video that plays behind the title instead of the photo.
    options:
      media: files
  - name: sidebar_photo
    label: Side photo
    component: photo
    description: Optional photo beside the text.
  - name: facts
    label: “At a glance” box
    type: object
    description: Optional short facts shown beside the text.
    fields:
    - name: label
      label: Label
      type: string
    - name: value
      label: Text
      type: string
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
  - name: pull_quote
    label: Pull quote
    type: object
    description: Optional. Copy a sentence from this page's text to show it large. It only appears if the same words are in
      the text.
    fields:
    - name: text
      label: Quote
      type: text
    - name: by
      label: Said by (optional)
      type: string
    - name: after_paragraph
      label: Show after paragraph number
      type: number
  - name: blocks
    label: Page sections
    component: page_sections
    description: The page, from top to bottom. Add text, photos, galleries, buttons and more.
